name: Tilt CI - End-to-End Deployment

on:
  push:
    branches:
      - main
      - development
      - 'story/**'
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tilt-ci:
    runs-on: ubuntu-latest
    env:
      # CI environment flag for scripts
      CI: "true"
      NON_INTERACTIVE: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl
          
          # Install kubectl (if not already available)
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          fi
          
          # Install kind (not available in apt repositories)
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version
          
          # Verify Docker is available (pre-installed on GitHub Actions runners)
          docker --version
          kubectl version --client
          
          # Verify Helm is installed
          helm version

      - name: Start local registry for Kind (localhost:5000)
        run: |
          REGISTRY_NAME="kind-registry"
          REGISTRY_PORT=5000
          
          # Check if our named registry exists and is running
          if docker ps --format '{{.Names}}' | grep -q "^${REGISTRY_NAME}$"; then
            echo "✅ Registry '${REGISTRY_NAME}' already running"
            exit 0
          fi
          
          # Check if registry exists but is stopped
          if docker ps -a --format '{{.Names}}' | grep -q "^${REGISTRY_NAME}$"; then
            echo "Starting existing registry '${REGISTRY_NAME}'..."
            docker start ${REGISTRY_NAME} || true
            exit 0
          fi
          
          # Check if port 5000 is already in use by another registry
          EXISTING_REGISTRY=$(docker ps --filter "publish=5000" --format '{{.Names}}' | head -1)
          if [ -n "$EXISTING_REGISTRY" ]; then
            echo "⚠️  Found existing registry '$EXISTING_REGISTRY' on port ${REGISTRY_PORT}"
            echo "Using existing registry instead of creating new one"
            # Update REGISTRY_NAME to use the existing one
            REGISTRY_NAME="$EXISTING_REGISTRY"
            echo "REGISTRY_NAME=${REGISTRY_NAME}" >> $GITHUB_ENV
            exit 0
          fi
          
          # Check if port 5000 is in use by a non-registry container
          if docker ps --filter "publish=5000" --format '{{.Names}}' | grep -q .; then
            echo "⚠️  Port ${REGISTRY_PORT} is in use by a non-registry container"
            echo "Attempting to create registry anyway (may fail if port is truly unavailable)..."
          fi
          
          # Create new registry
          echo "Creating new registry '${REGISTRY_NAME}' on port ${REGISTRY_PORT}..."
          docker rm -f ${REGISTRY_NAME} 2>/dev/null || true
          docker run -d --restart=always -p 127.0.0.1:${REGISTRY_PORT}:5000 \
            --name ${REGISTRY_NAME} registry:2 || {
            echo "❌ Failed to create registry. Port ${REGISTRY_PORT} may be in use."
            echo "Existing containers using port ${REGISTRY_PORT}:"
            docker ps --filter "publish=${REGISTRY_PORT}" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            exit 1
          }
          
          echo "✅ Registry '${REGISTRY_NAME}' created successfully"
          echo "REGISTRY_NAME=${REGISTRY_NAME}" >> $GITHUB_ENV

      - name: Create Kind cluster (with local registry mirror)
        uses: helm/kind-action@v1
        with:
          cluster_name: kube-startup-cpu-boost
          wait: 60s
          config: kind-config.yaml

      - name: Connect registry to kind network
        run: |
          # Use REGISTRY_NAME from previous step, or default to kind-registry
          REGISTRY_NAME="${REGISTRY_NAME:-kind-registry}"
          echo "Connecting registry '${REGISTRY_NAME}' to kind network..."
          
          # Check if registry is already connected to kind network
          if docker inspect ${REGISTRY_NAME} --format='{{range $net, $conf := .NetworkSettings.Networks}}{{$net}}{{end}}' | grep -q kind; then
            echo "✅ Registry '${REGISTRY_NAME}' already connected to kind network"
          else
            docker network connect kind ${REGISTRY_NAME} 2>/dev/null || {
              echo "⚠️  Failed to connect registry to kind network (may already be connected or network doesn't exist yet)"
            }
          fi
          
          # Verify registry is connected to kind network
          # We use container name (not IP) for containerd config, so we just need to verify connectivity
          if docker inspect ${REGISTRY_NAME} --format='{{range $net, $conf := .NetworkSettings.Networks}}{{$net}}{{end}}' | grep -q kind; then
            echo "✅ Registry '${REGISTRY_NAME}' is connected to kind network"
          else
            echo "⚠️  Registry not yet connected to kind network (will be configured by containerd script)"
          fi
          
          kubectl get nodes || echo "⚠️  kubectl not yet configured (cluster may still be starting)"
          kubectl get pods -A || true

      - name: Configure containerd registry mirror
        env:
          REGISTRY_NAME: ${{ env.REGISTRY_NAME || 'kind-registry' }}
        run: python3 scripts/configure_containerd_registry.py

      - name: Verify registry accessibility from Kind nodes
        run: |
          REGISTRY_NAME="${REGISTRY_NAME:-kind-registry}"
          
          echo "Verifying registry accessibility from Kind nodes..."
          echo "Registry name: ${REGISTRY_NAME}"
          echo "Using container name for DNS resolution (no IP extraction needed)"
          
          # Test registry access from a Kind node using container name
          NODE_NAME=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -z "$NODE_NAME" ]; then
            echo "❌ No Kind nodes found"
            exit 1
          fi
          
          echo "Testing from node: $NODE_NAME"
          
          # Test if registry is reachable via container name (Docker DNS)
          if docker exec $NODE_NAME sh -c "nc -zv ${REGISTRY_NAME} 5000" 2>&1; then
            echo "✅ Registry is reachable from node via container name"
          else
            echo "⚠️  Warning: Could not connect to registry from node (containerd config may still work)"
          fi
          
          # Test registry API via container name
          if docker exec $NODE_NAME sh -c "curl -s http://${REGISTRY_NAME}:5000/v2/" 2>&1 | grep -q "{}"; then
            echo "✅ Registry API is accessible via container name"
          else
            echo "⚠️  Warning: Could not access registry API (containerd config may still work)"
          fi
          
          echo "✅ Registry verification complete"

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get pods -A || true

      - name: Create namespace
        run: |
          kubectl create namespace kube-startup-cpu-boost-system --dry-run=client -o yaml | kubectl apply -f -

      - name: Create local registry ConfigMap for Tilt
        run: |
          # Create ConfigMap so Tilt can detect the local registry
          # This prevents the "You are running Kind without a local image registry" warning
          kubectl create namespace kube-public --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: local-registry-hosting
            namespace: kube-public
          data:
            localRegistryHosting.v1: |
              host: "localhost:5000"
              help: "https://kind.sigs.k8s.io/docs/user/local-registry/"
          EOF

      - name: Install Tilt
        run: |
          curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash
          tilt version

      - name: Get dependencies
        run: go mod download

      - name: Generate CRDs
        run: |
          make manifests
          ls -la config/crd/bases/

      - name: Install CRDs
        run: |
          kubectl apply -f config/crd/bases/
          kubectl wait --for=condition=established crd startupcpuboosts.autoscaling.x-k8s.io --timeout=60s

      - name: Run Tilt CI
        env:
          TILT_HOST: "0.0.0.0"
          CI: "true"
        run: |
          echo "Starting Tilt CI - will build, deploy, and wait for services to be healthy"
          echo "Tilt will:"
          echo "  1. Build Go binary for detected architecture"
          echo "  2. Build Docker image"
          echo "  3. Push image to localhost:5000 registry"
          echo "  4. Deploy via Helm chart"
          echo "  5. Wait for all resources to be ready"
          
          # Verify registry is accessible before starting Tilt
          echo "Verifying registry is accessible..."
          curl -s http://localhost:5000/v2/ || (echo "ERROR: Registry not accessible" && exit 1)
          
          # Tilt CI runs in non-interactive mode and waits for resources to be ready
          tilt ci --timeout 10m
          
          # Verify image was pushed after Tilt CI
          echo "Verifying image was pushed to registry..."
          curl -s http://localhost:5000/v2/kube-startup-cpu-boost/tags/list || echo "Warning: Could not verify image tags"
        timeout-minutes: 12

      - name: Check deployment status
        if: always()
        run: |
          # Check if kubectl is configured (cluster exists)
          if ! kubectl cluster-info &>/dev/null; then
            echo "⚠️  Kubernetes cluster not available (workflow may have failed before cluster creation)"
            exit 0
          fi
          
          echo "=== Kubernetes Resources ==="
          kubectl get all -n kube-startup-cpu-boost-system || echo "⚠️  Namespace may not exist"
          
          echo ""
          echo "=== Controller Manager Logs ==="
          kubectl logs -n kube-startup-cpu-boost-system -l control-plane=controller-manager --tail=100 || echo "⚠️  Controller manager pod may not exist"
          
          echo ""
          echo "=== RBAC Resources ==="
          kubectl get rolebinding,clusterrolebinding -n kube-startup-cpu-boost-system || echo "⚠️  RBAC resources may not exist"
          
          echo ""
          echo "=== Leader Election Lease ==="
          kubectl get leases -n kube-startup-cpu-boost-system || echo "⚠️  Leader election lease may not exist"

      - name: Verify controller functionality
        run: |
          echo "Waiting for controller to be ready..."
          kubectl wait --for=condition=ready pod -n kube-startup-cpu-boost-system -l control-plane=controller-manager --timeout=120s
          
          echo "Checking for RBAC errors in logs..."
          LOGS=$(kubectl logs -n kube-startup-cpu-boost-system -l control-plane=controller-manager --tail=50)
          if echo "$LOGS" | grep -i "forbidden\|error.*rbac\|error.*lease"; then
            echo "ERROR: RBAC errors detected in logs"
            echo "$LOGS"
            exit 1
          fi
          
          echo "Verifying leader election..."
          LEASES=$(kubectl get leases -n kube-startup-cpu-boost-system -o name)
          if [ -z "$LEASES" ]; then
            echo "WARNING: No leader election lease found"
          else
            echo "✅ Leader election lease exists"
            kubectl get leases -n kube-startup-cpu-boost-system
          fi
          
          echo "✅ Controller is running successfully"

      - name: Test CRD recognition
        run: |
          echo "Testing CRD recognition..."
          kubectl api-resources | grep startupcpuboost || (echo "ERROR: CRD not recognized" && exit 1)
          echo "✅ CRD is recognized by Kubernetes API"

      - name: Test controller reconciliation
        run: |
          echo "Creating test StartupCPUBoost resource..."
          kubectl apply -f config/tilt/test-startupcpuboost.yaml
          
          sleep 5
          
          echo "Checking resource status..."
          kubectl get startupcpuboost test-boost -n default -o yaml || true
          
          echo "Cleaning up test resource..."
          kubectl delete startupcpuboost test-boost -n default --ignore-not-found=true

      - name: Upload Tilt logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tilt-ci-logs
          retention-days: 3
          path: |
            ~/.tilt-dev/

      - name: Upload controller logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: controller-logs
          retention-days: 3
          path: |
            controller-logs.txt
        continue-on-error: true

      - name: Save controller logs
        if: always()
        run: |
          kubectl logs -n kube-startup-cpu-boost-system -l control-plane=controller-manager > controller-logs.txt 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up resources..."
          
          # Cleanup Tilt (if installed and running)
          if command -v tilt &>/dev/null; then
            tilt down || true
          fi
          
          # Cleanup Kind cluster
          if command -v kind &>/dev/null; then
            kind delete cluster --name kube-startup-cpu-boost || true
          fi
          
          # Cleanup registry (only if we created it, not if we reused an existing one)
          REGISTRY_NAME="${REGISTRY_NAME:-kind-registry}"
          if [ "$REGISTRY_NAME" = "kind-registry" ]; then
            docker rm -f ${REGISTRY_NAME} || true
            echo "✅ Removed registry '${REGISTRY_NAME}'"
          else
            echo "⚠️  Skipping registry cleanup (using existing registry '${REGISTRY_NAME}')"
          fi
          
          echo "✅ Cleanup complete"
