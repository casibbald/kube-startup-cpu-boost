apiVersion: autoscaling.x-k8s.io/v1alpha1
kind: StartupCPUBoost
metadata:
  name: spring-demo-app-boost
  namespace: demo
selector:
  matchLabels:
    app.kubernetes.io/name: spring-demo-app
spec:
  resourcePolicy:
    containerPolicies:
    - containerName: spring-demo-app
      fixedResources:
        requests: "2"
        limits: "4"
  durationPolicy:
    fixedDuration:
      unit: Minutes
      value: 5
  triggers:
  # Boost on pod creation (initial startup)
  - type: PodCreate
  # Boost when containers restart (recovery from crashes)
  - type: ContainerRestart
    containerName: spring-demo-app
  # Boost when pod recovers from NotReady to Ready (recovery scenarios)
  - type: PodConditionTransition
    conditionType: Ready
    fromStatus: "False"
    toStatus: "True"
  # Cooldown policy to prevent excessive activations during crash loops
  cooldown:
    # Minimum 5 minutes between activations
    minIntervalSeconds: 300
    # Maximum 3 activations per hour
    maxActivationsPerHour: 3
