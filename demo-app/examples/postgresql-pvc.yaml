# PersistentVolumeClaim for PostgreSQL data
# Uses Kind's local-path-provisioner for dynamic provisioning
# This allows data to persist across pod restarts

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard  # Kind's local-path-provisioner (auto-detected, can be 'standard' or 'local-path')
  resources:
    requests:
      storage: 1Gi  # 1GB should be sufficient for testing
