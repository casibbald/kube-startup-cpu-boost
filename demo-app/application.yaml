server:
  port: 5000
spring:
  datasource:
    url: jdbc:postgresql://postgresql:5432/mydb
    username: postgres
    password: postgres
    driverClassName: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always  # Enable SQL script execution (data.sql)
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
